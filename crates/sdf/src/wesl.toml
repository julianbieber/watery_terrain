# The WESL package of the shaders embedded from this crate, for wgsl-analyzer.
# The bevy packages are generated by `just wesl-deps`.
edition = "2026_pre"
package-manager = "cargo"
root = "."

[dependencies]
bevy_pbr = { path = "../../../.wesl-deps/bevy_pbr" }
constants = { path = "../../../.wesl-deps/constants" }
watery_terrain = { path = "../../../src" }
